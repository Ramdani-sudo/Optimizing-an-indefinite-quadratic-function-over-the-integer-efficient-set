name: Test OQPES

on:
  push:
    branches:
      - main
      - stabilize-tested-environment
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install package and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest==9.0.2

      - name: Run test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src;$env:PYTHONPATH"
          python -m pytest -q

      - name: Show environment versions
        if: always()
        shell: pwsh
        run: |
          python --version
          python -c "import numpy, scipy; print('NumPy', numpy.__version__); print('SciPy', scipy.__version__)"
